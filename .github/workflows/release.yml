# Releases the TeXmark VS Code extension (vscode/, klepo1.texmark). Its
# version is the "version" in vscode/package.json. Pull requests never change
# it; it moves only here, once per release. The npm package (the converter and
# CLI, root package.json) has its own version and workflow: npm-release.yml.
#
# Usual way, from GitHub (no local clone needed):
#   Actions > Release > Run workflow, pick patch / minor / major, or
#   "current" to release the version that is there now (the first release,
#   0.1.0). The workflow sets the version in vscode/package.json, tests and
#   builds, then pushes a "Release vX.Y.Z" commit to
#   main (none for "current") and the vX.Y.Z tag, and publishes.
#
# Fallback, from a clone: set the version yourself, merge it, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag must match the version in vscode/package.json.
#
# Either way the GitHub release carries the .vsix, with notes generated from
# the pull requests merged since the previous tag, and the .vsix goes to the
# VS Code Marketplace (and to Open VSX when the OVSX_PAT secret is set).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise (0.1.0 -> patch 0.1.1, minor 0.2.0, major 1.0.0), or current to release it as it is
        type: choice
        options: [minor, patch, major, current]
        default: minor

permissions:
  contents: write
  id-token: write # Marketplace trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only release from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow from main (it ran from $GITHUB_REF_NAME)"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      # Run from the Actions tab: set the version here. The commit and tag are
      # only pushed further down, after the tests and the build pass.
      - name: Set the version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != current ]; then
            (cd vscode && npm version "$BUMP" --no-git-tag-version)
          fi
          v=$(node -p "require('./vscode/package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::Tag v$v already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$v"
            echo "COMMIT=1" >> "$GITHUB_ENV"
          fi
          git tag "v$v"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Check the tag matches the extension version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ext=$(node -p "require('./vscode/package.json').version")
          if [ "$tag" != "$ext" ]; then
            echo "::error::Tag v$tag does not match vscode/package.json version $ext"
            exit 1
          fi
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci --prefix vscode

      - name: Test
        run: |
          npm test
          npm test --prefix vscode

      # vscode:prepublish copies texmark.js into the extension.
      - name: Build the VS Code extension
        working-directory: vscode
        run: npx vsce package -o "../texmark-${TAG#v}.vsix"

      # A push fails if main moved while this ran; nothing is published then,
      # so just run the workflow again. If main is protected by a ruleset that
      # GITHUB_TOKEN can't bypass, put a deploy key (write access, on the
      # ruleset's bypass list) in the RELEASE_DEPLOY_KEY secret: the commit
      # then goes to main with that key and the tag with GITHUB_TOKEN, so the
      # tag push doesn't start this workflow a second time.
      - name: Push the release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$COMMIT" ]; then
            git push origin "refs/tags/$TAG"
          elif [ -n "$DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/release_key
            chmod 600 ~/.ssh/release_key
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes" \
              git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main
            git push origin "refs/tags/$TAG"
          else
            git push --atomic origin HEAD:main "refs/tags/$TAG"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a re-run (e.g. after setting up publishing) the release exists:
          # replace its file instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" texmark-*.vsix --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "TeXmark $TAG" \
              --generate-notes \
              texmark-*.vsix
          fi

      # Trusted publishing: no token. The klepo1 publisher's "Trusted
      # Publishing" tab on marketplace.visualstudio.com/manage must list this
      # repository (klepo0/texmark) and workflow (release.yml).
      - name: Publish to the VS Code Marketplace
        working-directory: vscode
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath ../texmark-*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT secret not set; skipping Open VSX"
            exit 0
          fi
          npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath texmark-*.vsix
