name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Compile the example with LaTeX
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern > /dev/null
          node bin/texmark.js examples/heat.tmd -o heat.tex
          cd examples && cp ../heat.tex . && pdflatex -interaction=nonstopmode -halt-on-error heat.tex && pdflatex -interaction=nonstopmode -halt-on-error heat.tex
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Install LaTeX for the Build PDF checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern latexmk > /dev/null
      - name: Run the extension inside VS Code
        run: xvfb-run -a npm run test:vscode
      - name: Package
        run: npx vsce package
